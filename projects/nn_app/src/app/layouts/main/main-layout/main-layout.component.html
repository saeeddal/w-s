<div class="comp main-layout">
  <app-header />

  <div class="content-wrapper" [class.sidebar-collapsed]="!APP_FACADE.sidebar()">
    <aside class="sidebar-content">
      <app-sidebar></app-sidebar>
    </aside>
    <main class="content" (click)="closeMenuIfOpen()">
      <pt-basic-card
        [bgColor]="UK_TYPE.CARD.BG_COLOR.NORMAL"
        [padding]="UK_TYPE.CARD.PADDING.MEDIUM"
        [radius]="UK_TYPE.CARD.RADIUS.MEDIUM"
      >
        <pt-breadcrumb />
        <pt-divider
          [bgColor]="UK_TYPE.DIVIDER.BG_COLOR.GRADE_1"
          [marginY]="UK_TYPE.DIVIDER.MARGIN.M_8"
          [size]="UK_TYPE.DIVIDER.SIZE.PX_2"
        />
        <router-outlet />
      </pt-basic-card>
    </main>
  </div>
</div>
