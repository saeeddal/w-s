<div class="comp loan-list">
  <pt-label> دکتر خوش آمدید </pt-label>
  <pt-persian-datepicker
    [calendarType]="UK_TYPE.DATE_PICKER.TYPE.JALALI"
    [format]="UK_TYPE.DATE_PICKER.FORMAT.DATE_DASH"
    [(ngModel)]="myDate"
  />
  <pt-persian-datepicker format="yyyy/MM/dd HH:mm" [formControl]="myDate2" />
  <pt-data-table
    [items]="mockDataTable"
    [cols]="mockCols"
    [isLoading]="isLoading()"
    [totalRecords]="totalItems()"
    [rows]="pageSize()"
    [rowsPerPageOptions]="[5, 10, 20, 50, 100]"
    [selectionMode]="'multiple'"
    [dataKey]="'id'"
    (pageChanged)="onPageChanged($event)"
    (selectionChanged)="onSelectionChanged($event)"
  >
  </pt-data-table>
</div>
