<!-- persian-datepicker.html -->
<div class="pt persian-datepicker">
  <persian-date-picker
    [rtl]="rtl()"
    [minDate]="minDate()"
    [maxDate]="maxDate()"
    [calendarType]="calendarType()"
    [isRange]="isRange()"
    [format]="format()"
    [disabled]="disabled()"
    [(ngModel)]="selectedDate"
    (ngModelChange)="onDateChange($event)"
    (onBlur)="onTouched()"
  >
  </persian-date-picker>
</div>
