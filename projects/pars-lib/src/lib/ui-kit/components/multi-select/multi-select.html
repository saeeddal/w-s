<p-multiselect
  [options]="items"
  [(ngModel)]="innerValue"
  [placeholder]="placeholder"
  [name]="fieldName"
  [optionLabel]="bindLabel"
  [optionValue]="bindValue"
  [maxSelectedLabels]="3"
  selectedItemsLabel="{0} ایتم‌های انتخابی "
  display="chip"
  (ngModelChange)="onModelChange($event)"
  (onBlur)="onTouch()"
  emptyMessage="ایتمی یافت نشد"
>
  <ng-template pTemplate="item" let-item>
    <!-- Use custom template if provided, otherwise use default -->
    @if(customItemTemplate){
    <ng-container>
      <ng-container
        *ngTemplateOutlet="customItemTemplate; context: { $implicit: item }"
      ></ng-container>
    </ng-container>
    } @else{ {{item[bindLabel]}} }
  </ng-template>

  <ng-template pTemplate="emptyfilter">
    <div class="p-4 text-center">ایتمی وجود ندارد</div>
  </ng-template>
</p-multiselect>
