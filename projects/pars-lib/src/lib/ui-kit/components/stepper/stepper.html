<div class="stepper-container">
  <div class="stepper-header">
    <div class="steps">
      @for (step of steps(); let i = $index; track i) {
      <div
        class="step-item"
        [class.completed]="isStepCompleted(i)"
        [class.active]="isStepActive(i)"
        (click)="goToStep(i)"
      >
        <div class="step-wrapper">
          <div class="step-circle">
            @if (isStepCompleted(i)) {
            <span class="checkmark">✓</span>
            } @else { {{ i+1 }} }
          </div>
        </div>

        <div class="step-label">{{ step.title }}</div>

        <!-- No .step-line needed anymore - it's handled by CSS ::after -->
      </div>
      }
    </div>
  </div>

  <!-- Rest of your template remains the same -->
  <div class="step-content">
    <ng-container *ngTemplateOutlet="stepTemplates()[currentStepIndex()]"></ng-container>
  </div>

  <div class="stepper-actions">
    <pt-button
      (click)="previous()"
      [isDisabled]="currentStep() === 0"
      [fgColor]="UK_TYPE.BUTTON.fgColor.WHITE"
    >
      قبلی
    </pt-button>

    <pt-button (click)="next()" [fgColor]="UK_TYPE.BUTTON.fgColor.WHITE">
      {{ isLastStep() ? 'تمام' : 'بعدی' }}
    </pt-button>
  </div>
</div>
