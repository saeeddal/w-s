<!-- input.component.html -->
<div
  class="uk input"
  [ngClass]="[
    'uk-input-border-color-' + borderColor,
    'hasRedBorderWhenActive-' + hasRedBorderWhenActive,
    'isDisabled-' + disabled,
  ]"
>
  <div class="icon-wrapper">
    <ng-content select="[START]" />
  </div>
  <input
    appConvertPersianDigits
    [attr.maxlength]="maxLength !== null ? maxLength : null"
    [placeholder]="placeholder"
    [type]="inputType | lowercase"
    [value]="inputValue()"
    [disabled]="disabled"
    (blur)="onBlur()"
    (focus)="onFocus()"
    (input)="onChange($event)"
    #inputElement
  />

  <ng-content select="[END-TEXT]" />
  @if (inputValue()) {
    <div (click)="clearValue()">
      <ng-content select="[END]" />
    </div>
  }
</div>
